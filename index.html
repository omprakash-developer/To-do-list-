<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>JavaScript To-Do List</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="todo-container">

        <h1>My To-Do List</h1>

        <!-- Add Task -->
        <form id="todoForm">

            <input
                type="text"
                id="todoInput"
                placeholder="Enter a task..."
                autocomplete="off"
                required
            >

            <button type="submit">
                Add Task
            </button>

        </form>

        <!-- Filters -->
        <div class="filters">

            <button
                class="filter-btn active"
                data-filter="all">
                All
            </button>

            <button
                class="filter-btn"
                data-filter="active">
                Active
            </button>

            <button
                class="filter-btn"
                data-filter="completed">
                Completed
            </button>

        </div>

        <!-- Task List -->
        <ul id="todoList"></ul>

        <!-- Task Counter -->
        <p id="taskCount">
            0 tasks
        </p>

    </main>

    <script src="script.js"></script>

</body>
</html>
